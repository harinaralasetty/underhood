name: Bug report
description: Report incorrect findings or a parser/CLI failure.
title: 'Bug: '
body:
  - type: input
    id: version
    attributes:
      label: Tool version and host OS
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Prefer a minimal synthetic fixture. Do not include personal paths or private app contents.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include sanitized command, exit status and finding IDs.
    validations:
      required: true
