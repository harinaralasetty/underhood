  <g>
    <rect class="b" x="24" y="40" width="132" height="70" rx="8"/><text class="h" x="90" y="70" text-anchor="middle">1 · Detect</text><text class="s" x="90" y="92" text-anchor="middle">.app · PE · MSIX</text>
